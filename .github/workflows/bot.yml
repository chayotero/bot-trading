name: Bot Purpura 11 24-7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Limpiar chromedriver del sistema
        run: sudo rm -f /usr/bin/chromedriver

      - name: Instalar librerías de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Bot de Trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
